<div class="table-container">

  <div class="table-header">

    <h2>
      مدیریت مدل ها
    </h2>

    <button
      class="add-btn"
      (click)="openCreate()">

      افزودن

    </button>

  </div>

  <div class="admin-search-pager" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 0">
    <input type="search" aria-label="جست‌وجو" placeholder="جست‌وجوی نام…" [ngModel]="search()" (ngModelChange)="search.set($event); page.set(0)" style="padding:9px;min-width:200px;max-width:100%;border:1px solid #ddd;border-radius:8px">
    <span>{{ filtered().length }} مورد</span>
    <button type="button" (click)="changePage(-1)" [disabled]="page() === 0">قبلی</button>
    <span>صفحه {{ page() + 1 }} از {{ totalPages }}</span>
    <button type="button" (click)="changePage(1)" [disabled]="page() + 1 >= totalPages">بعدی</button>
  </div>
  <div class="table-wrapper">

  <table class="custom-table">

    <thead>

      <tr>
        <th>نام</th>
        <th>عملیات</th>
      </tr>

    </thead>

    <tbody>

      <tr *ngFor="let model of visible()">

        <td data-label="نام">
          {{ model.name }}
        </td>

        <td class="actions" data-label="عملیات">

          <button
            class="edit-btn"
            type="button"
            (click)="openEdit(model)">

            آپدیت

          </button>

          <button
            class="delete-btn"
            type="button"
            (click)="openDelete(model)">

            حذف

          </button>

        </td>

      </tr>

    </tbody>

  </table>

  </div>

</div>

<!-- CREATE MODAL -->

<div
  class="modal-backdrop"
  *ngIf="activeModal() === 'create'">

  <div class="modal-container sm">

    <div class="modal-header">

      <span>
        افزودن مدل جدید
      </span>

      <button
        class="close-btn"
        type="button"
        (click)="closeModal()">

        ×

      </button>

    </div>

    <div class="modal-body">

      <div class="form-group">

        <label>
          نام مدل
        </label>

        <input
          type="text"
          [(ngModel)]="createDto().name">

      </div>

      <button
        class="save-btn"
        type="button"
        (click)="create()">

        ذخیره

      </button>

    </div>

  </div>

</div>

<!-- EDIT MODAL -->

<div
  class="modal-backdrop"
  *ngIf="activeModal() === 'edit'">

  <div class="modal-container sm">

    <div class="modal-header">

      <span>
        ویرایش مدل
      </span>

      <button
        class="close-btn"
        type="button"
        (click)="closeModal()">

        ×

      </button>

    </div>

    <div class="modal-body">

      <div class="form-group">

        <label>
          نام مدل
        </label>

        <input
          type="text"
          [(ngModel)]="editDto().name">

      </div>

      <button
        class="save-btn"
        type="button"
        (click)="update()">

        ذخیره تغییرات

      </button>

    </div>

  </div>

</div>

<!-- DELETE MODAL -->

<div
  class="modal-backdrop"
  *ngIf="activeModal() === 'delete'">

  <div class="modal-container sm">

    <div class="modal-header">

      <span>
        حذف مدل
      </span>

      <button
        class="close-btn"
        type="button"
        (click)="closeModal()">

        ×

      </button>

    </div>

    <div class="modal-body">

      <p>
        آیا از حذف این مدل مطمئن هستید؟
      </p>

      <div class="delete-action-modal">

        <button
          class="yes-btn"
          type="button"
          (click)="deleteCarModel()">

          بله

        </button>

        <button
          class="no-btn"
          type="button"
          (click)="closeModal()">

          خیر

        </button>

      </div>

    </div>

  </div>

</div>
