name: Frontend build and proxy checks
on:
  push:
    branches:
      - main
      - fix/runflare-build-20261105
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Angular production build
        run: npm run build
      - name: SSR server smoke test
        shell: bash
        run: |
          set -euo pipefail
          PORT=3100 HOST=127.0.0.1 npm start >/tmp/mayacar-ssr.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          ok=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3100/favicon.ico >/dev/null 2>&1; then
              ok=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/mayacar-ssr.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            cat /tmp/mayacar-ssr.log
            exit 1
          fi
      - name: Proxy tests
        run: npm run test:api-proxy

  runflare-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify removed package is unused
        run: |
          if grep -RInE "ngx-persian-datepicker|NgxPersianDatepicker" src; then
            echo "Legacy datepicker is still referenced"
            exit 1
          fi
      - name: Check external Runflare mirror reachability
        run: |
          if curl -fsSI --connect-timeout 5 --max-time 12 https://mirror-npm.runflare.com/ >/dev/null; then
            echo "Runflare npm mirror reachable from CI"
          else
            echo "::warning::Runflare npm mirror is not reachable from this GitHub runner; validating force-install using public npm registry instead."
          fi
      - name: Reproduce Runflare --force install without .npmrc
        run: |
          rm .npmrc
          npm --registry=https://registry.npmjs.org install --force
      - name: Runflare-equivalent production build
        run: npm run build
