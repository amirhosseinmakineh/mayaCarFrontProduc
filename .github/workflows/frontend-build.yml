name: Frontend build and proxy checks
on:
  push:
    branches:
      - fix/runflare-build-20261105
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Angular production build
        run: npm run build
      - name: Proxy tests
        run: npm run test:api-proxy
